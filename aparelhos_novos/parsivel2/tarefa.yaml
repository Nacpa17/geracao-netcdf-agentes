nome: parsivel2_atto
descricao: |
  Disdrômetro óptico OTT Parsivel² no ATTO-Campina, integração de 60 s, espectro de
  32 classes de velocidade x 32 classes de tamanho por minuto (telegrama do aparelho).
  TODO (formato do arquivo bruto): software/logger que grava, separador, decimal,
  cabeçalho, fuso horário, se o horário é do início ou do fim do minuto e em que ordem
  vêm os 1024 valores do espectro.
  A física está em geracao_netcdf/aparelhos/parsivel2/fisica.py (pode importar dali).
amostras: amostras/
esquema: netCDF_info.json
constantes: variables_info.json
documentacao: ../../geracao_netcdf/aparelhos/parsivel2/DOCUMENTACAO.md
pontos_de_controle: []    # ex.: - {tempo: "2024-12-16 14:01:00", variavel: precip_rate, valor: 2.315}
max_iteracoes: 5
