# Testes automáticos a cada push / pull request: núcleo, validador, RD-80,
# molde, Parsivel², agente com respostas gravadas e benchmark.
# Não precisa de GPU nem de modelo de linguagem.
name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar o pacote e as dependências de teste
        run: python -m pip install -e ".[dev]"
      - name: Sintaxe de todos os módulos
        run: python -m compileall -q geracao_netcdf tests scripts
      - name: Testes
        run: python -m pytest -q
